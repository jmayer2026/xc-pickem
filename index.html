<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terre Haute Pick'em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Race-bib look: paper bib, heavy condensed numerals, safety-orange flag, turf green. Mobile-first single column. */
:root {
  --bg: #eef1ec;
  --surface: #ffffff;
  --ink: #15201a;
  --muted: #5b6a61;
  --line: #d3dbd4;
  --accent: #df5a12;
  --accent-ink: #ffffff;
  --turf: #2c6a3a;
  --turf-soft: #e1eee3;
  --warn-soft: #fbe9dd;
  --miss: #9aa59e;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1511; --surface: #16201a; --ink: #e6ede8; --muted: #9db0a3; --line: #2a3a30;
    --accent: #ff7a33; --accent-ink: #1a0d05; --turf: #73c486; --turf-soft: #1c3223; --warn-soft: #3a2416; --miss: #5e6e64;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1511; --surface: #16201a; --ink: #e6ede8; --muted: #9db0a3; --line: #2a3a30;
  --accent: #ff7a33; --accent-ink: #1a0d05; --turf: #73c486; --turf-soft: #1c3223; --warn-soft: #3a2416; --miss: #5e6e64;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 120px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* header bib */
.bib { margin: 16px 0 12px; background: var(--surface); border: 2px solid var(--ink); border-radius: 10px; padding: 14px 16px 12px; position: relative; overflow: hidden; }
.bib::before, .bib::after { content: ""; position: absolute; top: 10px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); background: var(--bg); }
.bib::before { left: 10px; } .bib::after { right: 10px; }
.bib .eyebrow { font-family: var(--display); font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: .08em; font-size: 14px; text-align: center; padding: 0 22px; }
.bib h1 { font-size: clamp(40px, 11vw, 64px); line-height: .95; text-align: center; font-weight: 800; text-transform: uppercase; }
.bib .meta { text-align: center; color: var(--muted); font-size: 14px; margin-top: 4px; }
.strip { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; border-top: 2px dashed var(--line); padding-top: 10px; }
.strip div { text-align: center; }
.strip b { display: block; font-family: var(--display); font-size: 26px; line-height: 1; font-weight: 800; }
.strip span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 12px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
nav.tabs a { flex: 0 0 auto; text-decoration: none; color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.note { background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.note.ok { background: var(--turf-soft); }
.field-row { display: grid; gap: 6px; margin-bottom: 12px; }
label.lbl { font-weight: 600; font-size: 14px; }
input[type="text"], input[type="number"], select { font: inherit; padding: 10px 12px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }

/* category cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.card-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.card-h .no { font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--accent); line-height: 1; min-width: 34px; }
.card-h h2 { font-size: 24px; font-weight: 700; text-transform: uppercase; }
.card .how { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 9px 12px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
.opt:hover { border-color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--warn-soft); }
.opt[disabled] { cursor: default; opacity: .65; }
.opt .who { font-weight: 600; }
.opt .sub { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.pill { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1; min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
.pill small { font-size: 12px; font-weight: 700; color: var(--muted); margin-left: 2px; }
.more { margin-top: 8px; background: none; border: 0; color: var(--turf); font-weight: 700; cursor: pointer; padding: 6px 0; }
.ou-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 10px; }
.ou-line output { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.ou-sides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ou-ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 2px solid var(--ink); z-index: 10; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.savebar .in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.savebar .sum { flex: 1; font-size: 14px; color: var(--muted); }
.savebar .sum b { color: var(--ink); }
.btn { font-family: var(--display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .04em; border: 0; border-radius: 8px; padding: 10px 18px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }

/* leaderboard */
.lb { display: grid; gap: 8px; }
.lb-row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.lb-top { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; }
.lb-top .rk { font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--muted); }
.lb-row.first .rk { color: var(--accent); }
.lb-top .nm { font-weight: 700; font-size: 18px; }
.lb-top .nm small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.lb-top .tot { font-family: var(--display); font-weight: 800; font-size: 32px; font-variant-numeric: tabular-nums; }
.lb-detail { border-top: 1px dashed var(--line); padding: 8px 14px 12px; }
.brk { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14px; }
.brk .k { color: var(--muted); }
.brk .v { text-align: right; font-variant-numeric: tabular-nums; }
.st { display: inline-block; width: 18px; text-align: center; font-weight: 800; }
.st.hit { color: var(--turf); } .st.miss { color: var(--miss); } .st.pending { color: var(--muted); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; background: var(--warn-soft); color: var(--accent); margin-left: 6px; vertical-align: middle; }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 0 -4px 16px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; font-size: 14px; color: var(--muted); white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td .sub { display: block; color: var(--muted); font-size: 12px; }
.sec-h { font-size: 26px; text-transform: uppercase; margin: 20px 0 6px; }
.prose p, .prose li { max-width: 65ch; }
.prose h2 { font-size: 24px; text-transform: uppercase; margin: 18px 0 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
@media (prefers-reduced-motion: no-preference) { .opt, .btn { transition: border-color .12s, background-color .12s; } }
</style>
</head>

function pts(W, p) {
  p = Math.min(Math.max(p, 0.002), 0.995);
  return Math.max(1, Math.round(W * Math.sqrt((1 - p) / p)));

// normalize: listed runners hold 98.5% of the win chance, podium chances sum to 2.92, 5K-leader chances to 0.75
(function () {
  const sw = RUNNERS.reduce((a, r) => a + r.win, 0);
  const s3 = RUNNERS.reduce((a, r) => a + r.top3, 0);
  const s5 = RUNNERS.reduce((a, r) => a + r.k5, 0);
  RUNNERS.forEach(r => { r.win = r.win * 0.985 / sw; r.top3 = Math.min(r.top3 * 2.92 / s3, 0.6); r.k5 = r.k5 * 0.75 / s5; });
  RUNNERS.sort((a, b) => b.win - a.win);
})();
const FIELD_WIN = 1 - RUNNERS.reduce((a, r) => a + r.win, 0);
const FIELD_K5 = 0.25;

// returns array of {key, label, pts, status: hit|miss|pending|push|none}
function scoreEntry(pk, res) {

    if (!pick) return out.push({ key, label, pts: 0, status: "none" });
    if (resVal == null || resVal === "") return out.push({ key, label, pts: 0, status: "pending" });
    const hit = pick === resVal;
    out.push({ key, label, pts: hit ? PTS[key](pick) : 0, status: hit ? "hit" : "miss" });
  };
  const many = (key, label, picks, resArr) => {

    if (!picks.length) return out.push({ key, label, pts: 0, status: "none" });
    if (!Array.isArray(resArr) || !resArr.length) return out.push({ key, label, pts: 0, status: "pending" });
    let p = 0, hits = 0;
    picks.forEach(id => { if (resArr.includes(id)) { p += PTS[key](id); hits++; } });
    out.push({ key, label, pts: p, status: hits ? "hit" : "miss", hits, of: picks.length });
  };
  const ou = (key, label, line, side, actual) => {
    if (line == null || !side) return out.push({ key, label, pts: 0, status: "none" });
    if (actual == null || actual === "") return out.push({ key, label, pts: 0, status: "pending" });
    if (actual === line) return out.push({ key, label, pts: 0, status: "push" });
    const wentOver = actual > line;

}

    if (locked() || !S.db || !S.uid) return;
    const d = S.draft;
    if (!d.nick.trim()) { S.saveMsg = "Add your name first so everyone knows whose picks these are."; renderPicks(); $("#nick").focus(); return; }
    S.saving = true; updateSaveBar();
    const body = JSON.parse(JSON.stringify(d));
    body.nick = d.nick.trim().slice(0, 24); body.uid = S.uid; body.savedAt = new Date().toISOString();
    try {
      await S.db.doc("picks/" + S.uid).set(body);
      S.dirty = false; S.saveMsg = "Saved. You can change picks until 11:10 a.m. ET Saturday.";
      try { localStorage.removeItem("thpe-draft"); } catch (e) {}
    } catch (e) {
      if (e && e.code === "permission_denied") { S.saveMsg = locked() ? "Couldn't save: picks are locked." : "Couldn't save: the pick sheet refused the change. Text Joe."; }
      else if (e && e.code === "unavailable") S.saveMsg = "Couldn't reach the pick sheet. Try Save again in a moment.";
      else S.saveMsg = "Couldn't save (" + ((e && e.code) || "error") + "). Try again.";
    }
    S.saving = false;
    if (S.tab === "picks") renderPicks();
  }

  // ---------- leaderboard ----------
  function displayName(e) { return e.nick || (S.names[e.uid] || "") || "Someone"; }
  function renderBoard() {
    const res = S.results || {};
    const rows = [...S.entries.values()].map(e => { const sc = scoreEntry(e, res); return { e, sc, tot: totalOf(sc) }; });
    rows.sort((a, b) => b.tot - a.tot || displayName(a.e).localeCompare(displayName(b.e)));
    const anyRes = S.results && ["champ","podium","topAm","topFr","lead5k","teamChamp","teamSecond","trophy","top10","time","score","us"].some(k => { const v = S.results[k]; return v != null && v !== "" && !(Array.isArray(v) && !v.length); });
    let h = "";
    if (!locked()) h += `<div class="note">Everyone's picks stay hidden until the 11:10 lock. You can see who's in.</div>`;
    else if (!anyRes) h += `<div class="note">Picks are locked. Points appear as results come in.</div>`;
    else h += `<div class="note ok">Results ${S.results.final ? "are final" : "are coming in"}. Tap a name to see their card.</div>`;
    if (!rows.length) h += `<p class="how">No entries yet. Make your picks on the first tab.</p>`;
    let rank = 0, prev = null;
    h += `<div class="lb">` + rows.map((r, i) => {
      if (r.tot !== prev) { rank = i + 1; prev = r.tot; }
      const mine = r.e.uid === S.uid;
      const late = r.e.savedAt && Date.parse(r.e.savedAt) > LOCK_AT;
      const showDetail = locked() || mine;
      const open = S.open[r.e.uid];
      const hits = r.sc.filter(x => x.status === "hit").length;
      let det = "";
      if (open && showDetail) {
        det = `<div class="lb-detail"><div class="brk">` + r.sc.map(x => {
          const mark = x.status === "hit" ? "✓" : x.status === "miss" ? "✗" : x.status === "push" ? "=" : "·";
          return `<div><span class="st ${x.status}">${mark}</span><span class="k">${x.label}:</span> ${esc(pickText(x.key, r.e))}</div><div class="v">${x.pts ? "+" + x.pts : ""}</div>`;
        }).join("") + `</div></div>`;
      } else if (open) det = `<div class="lb-detail how">Picks hidden until 11:10 a.m. ET.</div>`;
      return `<div class="lb-row ${rank === 1 && anyRes ? "first" : ""}"><button type="button" class="lb-top" data-act="open" data-val="${esc(r.e.uid)}" aria-expanded="${!!open}">
        <span class="rk num">${anyRes ? rank : "–"}</span>
        <span class="nm">${esc(displayName(r.e))}${mine ? '<span class="tag">you</span>' : ""}${late ? '<span class="tag">saved late</span>' : ""}<small>${filledCount(r.e)}/12 picked${anyRes ? " · " + hits + " hits" : ""}</small></span>
        <span class="tot num">${r.tot}</span></button>${det}</div>`;
    }).join("") + `</div>`;
    h += `<p class="how" style="margin-top:12px">Pot: $${rows.length * BUY_IN}, winner takes all. A tie for first splits the pot.</p>`;
    $("#main").innerHTML = h;
  }

  // ---------- odds ----------
  const pct = p => (p * 100 < 1 ? (p * 100).toFixed(1) : Math.round(p * 100)) + "%";
  function renderOdds() {
    let h = `<p class="how">These are my estimates, built from Nuttycombe, Pre-Nats, conference meets, regionals, last year's NCAA results and the Nov 16 coaches' poll. Saturday looks dry and mild (high near 68°F), so expect firm, fast ground. Points = weight × √((1−p)/p), so a pick I give a 1-in-4 shot pays about 1.7× the weight and a 1-in-100 shot about 10×.</p>`;
    h += `<h2 class="sec-h">Individual</h2><div class="tbl-wrap"><table><thead><tr><th>Runner</th><th class="r">Win</th><th class="r">Champ</th><th class="r">Top 3</th><th class="r">Podium</th><th class="r">5K</th></tr></thead><tbody>`;
    h += RUNNERS.map(r => `<tr><td><b>${esc(r.name)}</b><span class="sub">${esc(r.team)} · ${r.yr}${r.us ? " · USA" : ""}${r.note ? " — " + esc(r.note) : ""}</span></td><td class="r">${pct(r.win)}</td><td class="r"><b>${PTS.champ(r.id)}</b></td><td class="r">${pct(r.top3)}</td><td class="r"><b>${PTS.podium(r.id)}</b></td><td class="r"><b>${PTS.lead5k(r.id)}</b></td></tr>`).join("");
    h += `<tr><td><b>Field</b><span class="sub">Everyone else</span></td><td class="r">${pct(FIELD_WIN)}</td><td class="r"><b>${PTS.champ("field")}</b></td><td class="r">—</td><td class="r">—</td><td class="r"><b>${PTS.lead5k("field")}</b></td></tr></tbody></table></div>`;
    h += `<h2 class="sec-h">Teams</h2><div class="tbl-wrap"><table><thead><tr><th>Team</th><th class="r">Win</th><th class="r">Champ</th><th class="r">2nd</th><th class="r">Top 4</th><th class="r">Trophy</th><th class="r">Top 10</th><th class="r">Dark horse</th></tr></thead><tbody>`;
    h += TEAMS.map(t => `<tr><td><b>${esc(t.name)}</b><span class="sub">${t.rank <= 30 ? "No. " + t.rank : "Unranked"}</span></td><td class="r">${t.rank <= 11 ? pct(t.win) : "—"}</td><td class="r"><b>${t.rank <= 11 ? PTS.teamChamp(t.id) : "—"}</b></td><td class="r"><b>${t.rank <= 11 ? PTS.teamSecond(t.id) : "—"}</b></td><td class="r">${t.top4 ? pct(t.top4) : "—"}</td><td class="r"><b>${t.top4 ? PTS.trophy(t.id) : "—"}</b></td><td class="r">${pct(t.top10)}</td><td class="r"><b>${t.rank >= 11 ? PTS.darkHorse(t.id) : "—"}</b></td></tr>`).join("");
    h += `</tbody></table></div>`;
    const sideTbl = (title, list, fieldP, fn) => `<h2 class="sec-h">${title}</h2><div class="tbl-wrap"><table><thead><tr><th>Runner</th><th class="r">Chance</th><th class="r">Pts</th></tr></thead><tbody>` +
      list.map(a => `<tr><td><b>${esc(a.name)}</b><span class="sub">${esc(a.team)}</span></td><td class="r">${pct(a.p)}</td><td class="r"><b>${fn(a.id)}</b></td></tr>`).join("") +
      `<tr><td><b>Field</b></td><td class="r">${pct(fieldP)}</td><td class="r"><b>${fn("field")}</b></td></tr></tbody></table></div>`;
    h += sideTbl("Top American", AMERICANS, FIELD_AM, PTS.topAm);
    h += sideTbl("Top freshman", FRESHMEN, FIELD_FR, PTS.topFr);
    const ladder = (key, lines) => `<h2 class="sec-h">${OU[key].label}</h2><div class="tbl-wrap"><table><thead><tr><th>Line</th><th class="r">${OU[key].underText}</th><th class="r">${OU[key].overText}</th></tr></thead><tbody>` +
      lines.map(x => `<tr><td class="num">${key === "time" ? fmtTime(x) : x}</td><td class="r"><b>${ouPoints(key, x, "under")}</b></td><td class="r"><b>${ouPoints(key, x, "over")}</b></td></tr>`).join("") + `</tbody></table></div>`;
    h += ladder("time", [1710, 1725, 1740, 1755, 1770]) + `<p class="how">My median: 29:00. The course record is 28:41.3 (Sam Chelanga, 2009). Past NCAA winners here ran 28:41 to 30:33, usually 29:20 or slower, but this field is fast and Saturday looks dry.</p>`;
    h += ladder("score", [50, 65, 85, 100, 115, 130]) + `<p class="how">My median: 85. The last five winners scored 92, 83, 49, 124 and 57 (2021–2025). New Mexico scored 35 at its regional and 59 at Nuttycombe.</p>`;
    h += ladder("us", [6.5, 8.5, 9.5, 11.5, 13.5]) + `<p class="how">My median: 10. Last year 11 Americans finished in the top 40, but only 5 in the top 30.</p>`;
    $("#main").innerHTML = h;
  }

  function renderRules() {
    $("#main").innerHTML = `<div class="prose">
      <h2>How it works</h2>
      <ul><li>Everyone puts in $${BUY_IN}. Most points when results are final takes the pot. A tie for first splits it.</li>
      <li>Make all 12 picks on the first tab and tap <b>Save picks</b>. You can change them as often as you like until the men's gun at <b>11:10 a.m. ET Saturday</b>.</li>
      <li>Picks stay hidden from everyone else until the lock, then the whole board opens up.</li></ul>
      <h2>Scoring</h2>
      <p>Each pick has a price set from my estimate of its chance (p). If it hits you get weight × √((1−p)/p), at least 1 point. Long shots pay more per hit but hit less often. Picks that miss score 0, and so does a runner who doesn't start.</p>
      <p>Weights: individual champ 10 · podium 5 per runner · top American 8 · top freshman 8 · 5K leader 6 · team champ 10 · team runner-up 8 · trophy teams 4 per team · dark horse 8 · winning time 10 · team score 10 · US-born count 8.</p>
      <h2>Fine print</h2>
      <ul><li><b>Field</b> picks hit if the answer is anyone not on that list.</li>
      <li><b>5K leader</b> is the first runner listed at the official 5K split in the live results.</li>
      <li><b>Top freshman</b> uses class year as listed in the official results.</li>
      <li><b>American-born</b> means born in the US. If someone's birthplace is unclear, Joe makes the call before scoring.</li>
      <li><b>Over/under</b> lines are whatever you set. Landing exactly on the line is a push (0 points).</li>
      <li>Results come from the official NCAA results. Joe enters them, and he can fix mistakes after.</li>
      <li>Your picks are tied to this phone and browser. Make and edit them in the same browser you started in.</li></ul></div>`;
  }

  // ---------- results (owner) ----------
  function sel(id, list, val, withField, blank) {
    return `<select id="${id}"><option value="">${blank || "— not yet —"}</option>` + list.map(x => `<option value="${x.id}" ${val === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("") +
      (withField ? `<option value="field" ${val === "field" ? "selected" : ""}>Someone not listed (field)</option>` : "") + `</select>`;
  }
  function renderResults() {
    if (!S.isOwner) { $("#main").innerHTML = `<p class="how">Only Joe can enter results.</p><p class="how">Device ID: <code id="myid">${esc(S.uid || "connecting…")}</code></p>`; return; }
    const r = S.results || {};
    const pod = r.podium || [], tro = r.trophy || [], t10 = r.top10 || [];
    let h = `<div class="note">Only you see this tab. Leave anything blank that isn't known yet. Scores update for everyone when you save.</div>`;
    h += `<div class="card"><h2 class="sec-h" style="margin-top:0">Individual</h2>
      <div class="field-row"><label class="lbl" for="x-champ">Champion</label>${sel("x-champ", RUNNERS, r.champ, true)}</div>
      <div class="field-row"><label class="lbl">Top 3 (any order)</label>${[0, 1, 2].map(i => sel("x-pod" + i, RUNNERS, pod[i], true)).join("")}</div>
      <div class="field-row"><label class="lbl" for="x-topAm">Top American</label>${sel("x-topAm", AMERICANS, r.topAm, true)}</div>
      <div class="field-row"><label class="lbl" for="x-topFr">Top freshman</label>${sel("x-topFr", FRESHMEN, r.topFr, true)}</div>
      <div class="field-row"><label class="lbl" for="x-lead5k">Leader at 5K</label>${sel("x-lead5k", RUNNERS, r.lead5k, true)}</div>
      <div class="grid2"><div class="field-row"><label class="lbl" for="x-time">Winning time (mm:ss.t)</label><input type="text" id="x-time" inputmode="decimal" placeholder="28:41.3" value="${r.time != null ? fmtTime(r.time) : ""}"></div>
      <div class="field-row"><label class="lbl" for="x-us">US-born in top 40</label><input type="number" id="x-us" min="0" max="40" value="${r.us != null ? r.us : ""}"></div></div></div>`;
    h += `<div class="card"><h2 class="sec-h" style="margin-top:0">Teams</h2>
      <div class="field-row"><label class="lbl" for="x-teamChamp">Team champion</label>${sel("x-teamChamp", CHAMP_TEAMS, r.teamChamp, true)}</div>
      <div class="field-row"><label class="lbl" for="x-teamSecond">Runner-up</label>${sel("x-teamSecond", CHAMP_TEAMS, r.teamSecond, true)}</div>
      <div class="field-row"><label class="lbl" for="x-score">Winning team score</label><input type="number" id="x-score" min="15" max="400" value="${r.score != null ? r.score : ""}"></div>
      <div class="field-row"><label class="lbl">Top 4 (trophies)</label>${[0, 1, 2, 3].map(i => sel("x-tro" + i, TEAMS, tro[i], false)).join("")}</div>
      <div class="field-row"><label class="lbl">Top 10 teams (for dark horse)</label><div class="checks">${TEAMS.map(t => `<label><input type="checkbox" class="x-t10" value="${t.id}" ${t10.includes(t.id) ? "checked" : ""}>${esc(t.name)}</label>`).join("")}</div></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="x-final" ${r.final ? "checked" : ""}> Results are final</label></div>
      <button type="button" class="btn" data-act="saveResults">Save results</button> <span class="how" id="x-msg"></span>`;
    $("#main").innerHTML = h;
  }
  async function saveResults() {
    const v = id => { const el = document.getElementById(id); return el && el.value ? el.value : null; };
    const time = parseTime(v("x-time"));
    if (v("x-time") && time == null) { $("#x-msg").textContent = "Winning time needs to look like 28:41.3"; return; }
    const body = {
      champ: v("x-champ"), podium: [0, 1, 2].map(i => v("x-pod" + i)).filter(Boolean), topAm: v("x-topAm"), topFr: v("x-topFr"), lead5k: v("x-lead5k"),
      teamChamp: v("x-teamChamp"), teamSecond: v("x-teamSecond"), trophy: [0, 1, 2, 3].map(i => v("x-tro" + i)).filter(Boolean),
      top10: [...document.querySelectorAll(".x-t10:checked")].map(c => c.value), time, score: v("x-score") != null ? +v("x-score") : null,
      us: v("x-us") != null ? +v("x-us") : null, final: document.getElementById("x-final").checked, updatedAt: new Date().toISOString(),
    };
    $("#x-msg").textContent = "Saving…";
    try { await S.db.doc("results/official").set(body); $("#x-msg").textContent = "Saved. The leaderboard is updated."; }
    catch (e) { $("#x-msg").textContent = "Couldn't save (" + ((e && e.code) || "error") + ")."; }
  }

  // ---------- routing + events ----------
  function render() {
    renderHeader(); renderTabs();
    if (S.tab === "board") renderBoard(); else if (S.tab === "odds") renderOdds(); else if (S.tab === "rules") renderRules();
    else if (S.tab === "results") renderResults(); else renderPicks();
    updateSaveBar();
  }
  function route() {
    const h = (location.hash || "").slice(1);
    S.tab = ["picks", "board", "odds", "rules", "results"].includes(h) ? h : "picks";
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, val = b.dataset.val;
    const d = S.draft;
    if (act === "pick") { if (locked()) return; const [k, id] = val.split("|"); d[k] = d[k] === id ? null : id; setDirty(); renderKeep(); }
    else if (act === "toggle") {
      if (locked()) return; const [k, id] = val.split("|"); const max = k === "podium" ? 3 : 4; const arr = d[k] = (d[k] || []).slice();
      const i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else { if (arr.length >= max) arr.shift(); arr.push(id); }
      setDirty(); renderKeep();
    }
    else if (act === "side") { if (locked()) return; const [k, side] = val.split("|"); d[k + "Side"] = d[k + "Side"] === side ? null : side; setDirty(); renderKeep(); }
    else if (act === "expand") { S.expanded[val] = !S.expanded[val]; renderKeep(); }
    else if (act === "open") { S.open[val] = !S.open[val]; renderBoard(); }
    else if (act === "saveResults") saveResults();
  });
  function renderKeep() { const y = window.scrollY; renderPicks(); window.scrollTo(0, y); }
  document.addEventListener("input", ev => {
    const t = ev.target;
    if (t.id === "nick") { S.draft.nick = t.value; setDirty(); updateSaveBar(); return; }
    if (t.dataset && t.dataset.ou) {
      const k = t.dataset.ou, x = +t.value; S.draft[k + "Line"] = x; setDirty();
      const f = OU[k].unit === "time" ? fmtTime(x) : x;
      $("#ol-" + k).textContent = f; $("#ou-u-" + k).textContent = f; $("#ou-o-" + k).textContent = f;
      $("#ou-up-" + k).innerHTML = ouPoints(k, x, "under") + "<small>pts</small>"; $("#ou-op-" + k).innerHTML = ouPoints(k, x, "over") + "<small>pts</small>";
      updateSaveBar();
    }
  });
  $("#savebtn").addEventListener("click", save);
  setInterval(() => { const wasLocked = S._wasLocked; renderHeader(); if (locked() !== wasLocked) { S._wasLocked = locked(); render(); } }, 15000);
  S._wasLocked = locked();

  // ---------- data ----------
  async function connect() {
    let fb;
    try {
      const [appM, authM, fsM] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
      ]);
      fb = { appM, authM, fsM };
    } catch (e) { S.conn = "nodb"; render(); return; }
    if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) { S.conn = "nodb"; render(); return; }
    const app = fb.appM.initializeApp(FIREBASE_CONFIG);
    const auth = fb.authM.getAuth(app);
    const fs = fb.fsM.getFirestore(app);
    const F = fb.fsM;
    // small adapter so the rest of the page keeps the same calls
    const wrapDoc = d => ({ id: d.id, exists: d.exists(), data: () => d.data(), metadata: d.metadata });
    S.db = {
      doc: path => {
        const ref = F.doc(fs, path);
        return {
          set: body => F.setDoc(ref, body).catch(e => { throw { code: e.code === "permission-denied" ? "permission_denied" : (e.code || "error") }; }),
          onSnapshot: (next, err) => F.onSnapshot(ref, d => next(wrapDoc(d)), err),
        };
      },
      collection: path => ({
        onSnapshot: (next, err) => F.onSnapshot(F.collection(fs, path), q => next({ docs: q.docs.map(wrapDoc), metadata: q.metadata }), err),
      }),
    };
    try {
      const cred = await fb.authM.signInAnonymously(auth);
      S.uid = cred.user.uid;
    } catch (e) { S.conn = "nodb"; render(); return; }
    S.isOwner = S.uid === ADMIN_UID;
    let first = true;
    const timer = setTimeout(() => { if (first) { S.conn = "slow"; if (S.tab === "picks") renderPicks(); } }, 10000);
    S.db.collection("picks").onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      const m = new Map();
      snap.docs.forEach(doc => { const v = doc.data(); if (v) m.set(doc.id, Object.assign({ uid: doc.id }, v)); });
      S.entries = m;
      const mine = m.get(S.uid);
      let rerender = first;
      if (mine && !S.loadedMine) { if (!S.dirty) S.draft = Object.assign(defaultDraft(), mine); S.loadedMine = true; rerender = true; }
      if (first) { first = false; S.conn = "ok"; }
      if (S.tab === "picks") { if (rerender && document.activeElement?.id !== "nick") { const y = window.scrollY; renderPicks(); window.scrollTo(0, y); } else updateSaveBar(); }
      else if (S.tab === "board") renderBoard();
      renderHeader();
    }, () => { clearTimeout(timer); S.conn = "slow"; render(); });
    S.db.doc("results/official").onSnapshot(s => { S.results = s.exists ? s.data() : null; if (S.tab === "board") renderBoard(); }, () => {});
    render();
  }
  route();
  connect();
})();
</script>
</body>
</html>
