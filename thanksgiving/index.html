function erf(x) { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x);

  async function firebaseDb() {

    const app = appM.initializeApp(FIREBASE_CONFIG);
    const auth = authM.getAuth(app), fs = fsM.getFirestore(app);
    if (QS.get("emu") === "1") { authM.connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true }); fsM.connectFirestoreEmulator(fs, "127.0.0.1", 8080); }
    const cred = await authM.signInAnonymously(auth);
    return {
      uid: cred.user.uid,
      setFields: (path, body, fields) => fsM.setDoc(fsM.doc(fs, path), body, { mergeFields: fields }),
      onDoc: (path, next, err) => fsM.onSnapshot(fsM.doc(fs, path), d => next(d.exists() ? d.data() : null), err),
      onCollection: (path, next, err) => fsM.onSnapshot(fsM.collection(fs, path), q => next(q.docs.map(d => ({ id: d.id, data: d.data() }))), err),
    };
  }
  function mockDb() { // test mode: shared via localStorage across tabs; ?uid= picks identity
    const uid = QS.get("uid") || "me"; const K = "tgpe-mockdb";
    const read = () => { try { return JSON.parse(localStorage.getItem(K) || "{}"); } catch (e) { return {}; } };
    const subs = [];
    const fire = () => subs.forEach(f => f());
    window.addEventListener("storage", e => { if (e.key === K) fire(); });
    return { uid,
      setFields: async (path, body, fields) => { await new Promise(r => setTimeout(r, 80)); const all = read(); const id = path.split("/")[1];
        if (QS.get("failsave") === "1") throw { code: "permission-denied" };
        const cur = all[id] || {}; fields.forEach(f => { if (f in body) cur[f] = body[f]; }); all[id] = cur; localStorage.setItem(K, JSON.stringify(all)); fire(); },
      onDoc: (path, next) => { const id = path.split("/")[1]; const f = () => next(read()[id] || null); subs.push(f); setTimeout(f, 50); return () => {}; },
      onCollection: (path, next) => { const f = () => { const all = read(); next(Object.keys(all).map(id => ({ id, data: all[id] }))); }; subs.push(f); setTimeout(f, 50); return () => { const i = subs.indexOf(f); if (i >= 0) subs.splice(i, 1); }; },
    };
  }
  // results.json is published after each game; polled every 30s
  async function pollResults() {
    try {
      const r = await fetch((QS.get("results") || "results.json") + "?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) { const j = await r.json(); const prev = JSON.stringify(S.results); S.results = (j && typeof j === "object") ? j : {};
        if (JSON.stringify(S.results) !== prev) { const ae = document.activeElement; if (S.tab === "board") renderBoard(); else if (S.tab === "picks" && !(ae && (ae.id === "nick" || ae.type === "range" || ae.type === "number"))) render(true); } }
    } catch (e) {}
  }
  pollResults(); setInterval(pollResults, 30000);
  route();
  connect();
})();
